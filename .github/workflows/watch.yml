name: Kereby watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub may delay runs a few minutes)
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write            # needed to save seen.json back to the repo

concurrency:
  group: kereby-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Headless browser, only used by the script if the plain HTML
      # doesn't contain all listings
      - run: python -m playwright install --with-deps chromium

      - name: Check Kereby
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Optional email (leave these secrets unset to skip email)
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python kereby_watch.py

      - name: Save state
        run: |
          git config user.name "kereby-bot"
          git config user.email "kereby-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen listings" && git push)
